name: Build Android APK

# Triggers: push to main, or run manually from the Actions tab.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gradle (used by Flutter's Android build) needs a JDK.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Install the Flutter SDK (no local install needed on your machine).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The GitHub runner has no Android SDK by default. Use @v4 (NOT @v3):
      # v3's default packages include the deprecated `tools` package that
      # Google removed, so it fails with "Failed to find package 'tools'".
      # v4 defaults to `platform-tools` and auto-accepts licenses.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      # Generate a canonical Flutter project (correct Gradle wrapper + native
      # scaffolding) in a temp dir, then copy only the `android/` folder into
      # the workspace. We keep our own lib/, test/ and pubspec.yaml.
      - name: Generate Flutter project scaffold
        run: |
          flutter create --project-name hello_world_app /tmp/flutter_app
          cp -r /tmp/flutter_app/android ./

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      # Debug APK: installs and runs on any device/emulator with
      # "unknown sources" enabled, with no signing setup required.
      - name: Build debug APK
        run: flutter build apk --debug

      # Upload the built APK so it can be downloaded from the Actions page.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
