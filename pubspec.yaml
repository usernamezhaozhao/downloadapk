name: hello_world_app
description: 抖音下载器 — 首页 Hello World + 权限自检中心（测试页）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 权限状态读取 / 运行时申请
  permission_handler: ^11.3.0
  # 后端健康自检（HTTP 明文）
  http: ^1.2.0
  # 存储路径
  path_provider: ^2.1.0
  # 发送测试通知
  flutter_local_notifications: ^17.2.0
  # 调用系统播放器（依赖 FileProvider）
  open_filex: ^5.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - img.jpg
    - song.mp4
